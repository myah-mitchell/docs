site_name: Documentation, How-Tos, and Ramblings
site_url: https://myah-mitchell.github.io/docs/
site_author: Myah Mitchell
copyright: >
  Copyright &copy; 2026 Myah Mitchell.
  Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
repo_url: https://github.com/myah-mitchell/docs
repo_name: myah-mitchell/docs
edit_uri: edit/main/content/
docs_dir: content

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/details.py

plugins:
  - search
  - blog:
      blog_dir: blog
  # Old addresses, and the page each one leads to.
  - redirects:
      redirect_maps:
        fleet-bootstrap/procedures/provision-a-vm.md: fleet-bootstrap/concepts/how-a-host-is-built.md
        fleet-bootstrap/procedures/one-run-provisioning.md: fleet-bootstrap/concepts/how-a-host-is-built.md
        fleet-bootstrap/foundation/proxmox-and-template.md: fleet-bootstrap/foundation/proxmox-and-installer.md
        fleet-bootstrap/hosts/km01.md: fleet-bootstrap/hosts/km01-komodo.md
        fleet-bootstrap/hosts/ci01/index.md: fleet-bootstrap/hosts/ci01-automation.md
        fleet-bootstrap/hosts/ci01/semaphore.md: fleet-bootstrap/hosts/ci01-semaphore.md
        fleet-bootstrap/hosts/ci01/victoriametrics.md: fleet-bootstrap/hosts/ci01-victoriametrics.md
        fleet-bootstrap/hosts/ci01/core-infra.md: fleet-bootstrap/hosts/ci01-core-infra.md
        fleet-bootstrap/hosts/id01.md: fleet-bootstrap/hosts/id01-identity.md
        fleet-bootstrap/hosts/pk01.md: fleet-bootstrap/hosts/pk01-certificates.md
        fleet-bootstrap/hosts/tf01.md: fleet-bootstrap/hosts/tf01-traefik-hub.md
        fleet-bootstrap/hosts/bh01.md: fleet-bootstrap/hosts/bh01-dmz-edge.md
        fleet-bootstrap/hosts/mx01.md: fleet-bootstrap/hosts/mx01-mail.md
        fleet-bootstrap/shared-stacks/system-agent.md: fleet-bootstrap/stacks/system-agent.md
        fleet-bootstrap/shared-stacks/traefik-agent.md: fleet-bootstrap/stacks/traefik-agent.md
        fleet-bootstrap/shared-stacks/traefik-bootstrap.md: fleet-bootstrap/stacks/traefik-bootstrap.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - github-callouts
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - pymdownx.blocks.tab:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Fleet bootstrap:
      - fleet-bootstrap/index.md
      - Concepts:
          - How a host is built: fleet-bootstrap/concepts/how-a-host-is-built.md
          - The NixOS flake: fleet-bootstrap/concepts/nixos-flake.md
          - The private repo: fleet-bootstrap/concepts/fleet-private.md
          - Secrets with sops: fleet-bootstrap/concepts/secrets-with-sops.md
          - Bootstrap mode: fleet-bootstrap/concepts/bootstrap-mode.md
          - Host layout: fleet-bootstrap/concepts/host-layout.md
          - Variables and Secrets: fleet-bootstrap/concepts/variables-and-secrets.md
      - The foundation:
          - fleet-bootstrap/foundation/index.md
          - The control shell: fleet-bootstrap/foundation/control-shell.md
          - Proxmox and the installer ISO: fleet-bootstrap/foundation/proxmox-and-installer.md
          - The first run: fleet-bootstrap/foundation/first-run.md
          - Setting up Komodo: fleet-bootstrap/foundation/komodo-setup.md
          - The Semaphore project: fleet-bootstrap/foundation/semaphore-project.md
          - The handover: fleet-bootstrap/foundation/handover.md
      - Hosts:
          - Komodo (km01): fleet-bootstrap/hosts/km01-komodo.md
          - Automation and monitoring (ci01): fleet-bootstrap/hosts/ci01-automation.md
          - Semaphore (ci01): fleet-bootstrap/hosts/ci01-semaphore.md
          - VictoriaMetrics (ci01): fleet-bootstrap/hosts/ci01-victoriametrics.md
          - Core infrastructure (ci01): fleet-bootstrap/hosts/ci01-core-infra.md
          - Identity (id01): fleet-bootstrap/hosts/id01-identity.md
          - Certificates (pk01): fleet-bootstrap/hosts/pk01-certificates.md
          - Traefik hub (tf01): fleet-bootstrap/hosts/tf01-traefik-hub.md
          - DMZ edge (bh01): fleet-bootstrap/hosts/bh01-dmz-edge.md
          - Mail (mx01): fleet-bootstrap/hosts/mx01-mail.md
          - Applications (ap01): fleet-bootstrap/hosts/ap01-applications.md
      - Stacks:
          - fleet-bootstrap/stacks/index.md
          - authentik-server: fleet-bootstrap/stacks/authentik-server.md
          - core-infra: fleet-bootstrap/stacks/core-infra.md
          - crowdsec-agent: fleet-bootstrap/stacks/crowdsec-agent.md
          - crowdsec-server: fleet-bootstrap/stacks/crowdsec-server.md
          - dozzle-agent: fleet-bootstrap/stacks/dozzle-agent.md
          - dozzle-server: fleet-bootstrap/stacks/dozzle-server.md
          - komodo-server: fleet-bootstrap/stacks/komodo-server.md
          - semaphore-server: fleet-bootstrap/stacks/semaphore-server.md
          - stalwart-server: fleet-bootstrap/stacks/stalwart-server.md
          - step-ca-server: fleet-bootstrap/stacks/step-ca-server.md
          - system-agent: fleet-bootstrap/stacks/system-agent.md
          - technitium-server: fleet-bootstrap/stacks/technitium-server.md
          - traefik-agent: fleet-bootstrap/stacks/traefik-agent.md
          - traefik-basic: fleet-bootstrap/stacks/traefik-basic.md
          - traefik-bootstrap: fleet-bootstrap/stacks/traefik-bootstrap.md
          - traefik-dmz: fleet-bootstrap/stacks/traefik-dmz.md
          - traefik-server: fleet-bootstrap/stacks/traefik-server.md
          - victoriametrics-agent: fleet-bootstrap/stacks/victoriametrics-agent.md
          - victoriametrics-server: fleet-bootstrap/stacks/victoriametrics-server.md
      - Procedures:
          - Adding a host: fleet-bootstrap/procedures/add-a-host.md
          - Leaving bootstrap mode: fleet-bootstrap/procedures/leave-bootstrap-mode.md
          - Deploying a stack by hand: fleet-bootstrap/procedures/deploy-a-stack-by-hand.md
          - Rebuilding a VM: fleet-bootstrap/procedures/rebuild-a-vm.md
          - Growing a disk: fleet-bootstrap/procedures/grow-a-disk.md
          - Updating the fleet: fleet-bootstrap/procedures/update-the-fleet.md
  - How-tos:
      - how-tos/index.md
  - Standards:
      - standards/index.md
      - Markdown style guide: standards/markdown-style-guide.md
  - Ramblings:
      - blog/index.md
