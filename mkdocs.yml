site_name: Documentation, How-Tos, and Ramblings
site_url: https://myah-mitchell.github.io/docs/
site_author: Myah Mitchell
copyright: >
  Copyright &copy; 2026 Myah Mitchell.
  Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
repo_url: https://github.com/myah-mitchell/docs
repo_name: myah-mitchell/docs
edit_uri: edit/main/content/
docs_dir: content

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/details.py

plugins:
  - search
  - blog:
      blog_dir: blog

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - github-callouts
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - pymdownx.blocks.tab:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Fleet bootstrap:
      - fleet-bootstrap/index.md
      - Procedures:
          - Provisioning a VM: fleet-bootstrap/procedures/provision-a-vm.md
          - One-run provisioning: fleet-bootstrap/procedures/one-run-provisioning.md
          - Rebuilding a VM: fleet-bootstrap/procedures/rebuild-a-vm.md
      - Hosts:
          - km01: fleet-bootstrap/hosts/km01.md
          - ci01:
              - fleet-bootstrap/hosts/ci01/index.md
              - Semaphore: fleet-bootstrap/hosts/ci01/semaphore.md
              - VictoriaMetrics: fleet-bootstrap/hosts/ci01/victoriametrics.md
              - core-infra: fleet-bootstrap/hosts/ci01/core-infra.md
          - id01: fleet-bootstrap/hosts/id01.md
          - pk01: fleet-bootstrap/hosts/pk01.md
          - tf01: fleet-bootstrap/hosts/tf01.md
          - bh01: fleet-bootstrap/hosts/bh01.md
          - mx01: fleet-bootstrap/hosts/mx01.md
      - Shared stacks:
          - traefik-bootstrap: fleet-bootstrap/shared-stacks/traefik-bootstrap.md
          - system-agent: fleet-bootstrap/shared-stacks/system-agent.md
          - traefik-agent: fleet-bootstrap/shared-stacks/traefik-agent.md
  - How-tos:
      - how-tos/index.md
  - Standards:
      - standards/index.md
      - Markdown style guide: standards/markdown-style-guide.md
  - Ramblings:
      - blog/index.md
