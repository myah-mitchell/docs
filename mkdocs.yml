site_name: Documentation, How-Tos, and Ramblings
site_url: https://myah-mitchell.github.io/docs/
site_author: Myah Mitchell
copyright: >
  Copyright &copy; 2026 Myah Mitchell.
  Licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
repo_url: https://github.com/myah-mitchell/docs
repo_name: myah-mitchell/docs
edit_uri: edit/main/content/
docs_dir: content

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - hooks/details.py

plugins:
  - search
  - blog:
      blog_dir: blog
  # Old addresses, and the page each one leads to.
  - redirects:
      redirect_maps:
        fleet-bootstrap/procedures/provision-a-vm.md: fleet-bootstrap/concepts/how-a-host-is-built.md
        fleet-bootstrap/procedures/one-run-provisioning.md: fleet-bootstrap/concepts/how-a-host-is-built.md
        fleet-bootstrap/foundation/proxmox-and-template.md: fleet-bootstrap/foundation/proxmox-and-installer.md
        fleet-bootstrap/hosts/km01.md: fleet-bootstrap/hosts/km01-komodo.md
        fleet-bootstrap/hosts/ci01/index.md: fleet-bootstrap/hosts/ci01-automation.md
        fleet-bootstrap/hosts/ci01/semaphore.md: fleet-bootstrap/hosts/ci01-semaphore.md
        fleet-bootstrap/hosts/ci01/victoriametrics.md: fleet-bootstrap/hosts/ci01-victoriametrics.md
        fleet-bootstrap/hosts/ci01/core-infra.md: fleet-bootstrap/hosts/ci01-core-infra.md
        fleet-bootstrap/hosts/id01.md: fleet-bootstrap/hosts/id01-identity.md
        fleet-bootstrap/hosts/pk01.md: fleet-bootstrap/hosts/pk01-certificates.md
        fleet-bootstrap/hosts/tf01.md: fleet-bootstrap/hosts/tf01-traefik-hub.md
        fleet-bootstrap/hosts/bh01.md: fleet-bootstrap/hosts/bh01-dmz-edge.md
        fleet-bootstrap/hosts/mx01.md: fleet-bootstrap/hosts/mx01-mail.md
        fleet-bootstrap/shared-stacks/system-agent.md: fleet-bootstrap/stacks/system-agent.md
        fleet-bootstrap/shared-stacks/traefik-agent.md: fleet-bootstrap/stacks/traefik-agent.md
        fleet-bootstrap/shared-stacks/traefik-bootstrap.md: fleet-bootstrap/stacks/traefik-bootstrap.md

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - md_in_html
  - tables
  - github-callouts
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [snippets]
      check_paths: true
  - pymdownx.blocks.tab:
      alternate_style: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

