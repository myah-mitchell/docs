# What each Komodo Variable and Secret is, for the generated register page.
#
# fleet_facts.py reads the names from fleet-stacks' komodo.env files and the
# descriptions from here. It stops when a name is referenced there and missing
# here, or described here and referenced nowhere, so this file never drifts
# from the stacks.
#
# kind is Variable or Secret. A Secret is a Variable created with Is Secret
# ticked. value is Markdown, and goes in a table cell, so keep it on one line.
# A group with every_stack: true is one every stack reads, and the stack pages
# mention it in a sentence instead of listing it.

groups:
  - id: operational
    title: Operational defaults
    every_stack: true
    intro: >-
      Every stack reads these nineteen, so they are created once, in
      [Setting up Komodo](../foundation/komodo-setup.md#operational), before
      anything is deployed through Komodo. They are the same values
      `scripts/base-testing.env` in fleet-stacks uses for local testing.
      Adjust them to taste.
    names:
      GLOBAL_PUID: {kind: Variable, value: "`1000`"}
      GLOBAL_PGID: {kind: Variable, value: "`1000`"}
      GLOBAL_TZ: {kind: Variable, value: "Your timezone, for example `America/Chicago`"}
      GLOBAL_DOCKER_VOLUMES: {kind: Variable, value: "`/opt/docker/volumes`"}
      GLOBAL_DOCKER_LOGS: {kind: Variable, value: "`/opt/docker/logs`"}
      GLOBAL_PROXY_NETWORK: {kind: Variable, value: "`proxy`"}
      GLOBAL_MEM_LIMIT: {kind: Variable, value: "`2G`"}
      GLOBAL_MEM_SWAP_LIMIT: {kind: Variable, value: "`2.5G`"}
      GLOBAL_MEM_RESERVATION: {kind: Variable, value: "`64M`"}
      GLOBAL_PIDS_LIMIT: {kind: Variable, value: "`200`"}
      GLOBAL_CPUS_LIMIT: {kind: Variable, value: "`2`"}
      GLOBAL_RESTART_GRACE: {kind: Variable, value: "`1m`"}
      GLOBAL_RESTART_MODE: {kind: Variable, value: "`unless-stopped`"}
      GLOBAL_LOG_MAX_SIZE: {kind: Variable, value: "`10m`"}
      GLOBAL_LOG_MAX_FILE: {kind: Variable, value: "`3`"}
      GLOBAL_HEALTH_INTERVAL: {kind: Variable, value: "`60s`"}
      GLOBAL_HEALTH_TIMEOUT: {kind: Variable, value: "`10s`"}
      GLOBAL_HEALTH_RETRIES: {kind: Variable, value: "`5`"}
      GLOBAL_HEALTH_START: {kind: Variable, value: "`10s`"}

  - id: komodo
    title: Komodo's database
    intro: >-
      Komodo Core keeps its data in FerretDB on Postgres. Core is started by
      hand the first time, from a file that holds these two values, and then
      takes over its own Stack. The values in Komodo must match the ones in
      that file, or the first deploy through Komodo locks Core out of its own
      database. Staged in
      [Setting up Komodo](../foundation/komodo-setup.md#komodo).
    names:
      KOMODO_DB_USERNAME: {kind: Secret, value: "The username from the first start, for example `komodo-admin`"}
      KOMODO_DB_PASSWORD: {kind: Secret, value: "The password from the first start, 48 alphanumeric characters"}

  - id: traefik
    title: Traefik
    intro: >-
      Every Traefik stack carries the same five references, because each is
      built on the same base service. The two Redis values are read only by
      the stacks that run traefik-kop or a Redis replica. Staged in
      [Setting up Komodo](../foundation/komodo-setup.md#traefik), before the
      first host, because traefik-bootstrap carries the references too.
    notes: >-
      traefik-bootstrap has no certificate resolver and no forward auth, so it
      carries the first five without using them. The values still have to
      exist, or the literal `[[...]]` text reaches the container.
    names:
      CF_API_EMAIL: {kind: Secret, value: "The Cloudflare account email that owns the DNS token"}
      CF_DNS_API_TOKEN: {kind: Secret, value: "A Cloudflare API token, scoped to edit DNS for the zone"}
      LE_EMAIL: {kind: Secret, value: "The address to register the Let's Encrypt account under"}
      GLOBAL_AUTHENTIK_HOST: {kind: Variable, value: "`authentik.id01.home.myah-mitchell.com`, the hostname with no scheme"}
      GLOBAL_CROWDSEC_LAPI_HOST: {kind: Variable, value: "`unused`. CrowdSec was cut from the plan, and the bouncer stays off while `CROWDSEC_LAPI_KEY` is blank"}
      TRAEFIK_KOP_REDIS_SERVER: {kind: Secret, value: "`tf01.home.myah-mitchell.com`"}
      TRAEFIK_KOP_REDIS_PASSWORD: {kind: Secret, value: "Your choice, alphanumeric only"}

  - id: semaphore
    title: Semaphore
    intro: >-
      Read by semaphore-server on ci01. Staged on
      [Semaphore (ci01)](../hosts/ci01-semaphore.md#values), which also
      shows how to generate the three keys.
    notes: >-
      The three keys encrypt what Semaphore stores. Changing one later makes
      every stored login and access key unreadable, so keep a copy of all
      three somewhere safe.
    names:
      SEMAPHORE_ADMIN_USER: {kind: Secret, value: "Your choice"}
      SEMAPHORE_ADMIN_NAME: {kind: Secret, value: "Your choice"}
      SEMAPHORE_ADMIN_EMAIL: {kind: Secret, value: "Your choice"}
      SEMAPHORE_ADMIN_PASSWORD: {kind: Secret, value: "Your choice, alphanumeric only"}
      SEMAPHORE_COOKIE_HASH: {kind: Secret, value: "The first generated key, 32 random bytes as base64"}
      SEMAPHORE_COOKIE_ENCRYPTION: {kind: Secret, value: "The second generated key"}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: {kind: Secret, value: "The third generated key"}
      SEMAPHORE_POSTGRES_USER: {kind: Secret, value: "Your choice"}
      SEMAPHORE_POSTGRES_PASSWORD: {kind: Secret, value: "Your choice, alphanumeric only"}
      SEMAPHORE_TOFU_STATE_PASSWORD: {kind: Secret, value: "Your choice, alphanumeric only. The `tofu` role's password for the OpenTofu state database"}

  - id: telemetry
    title: Telemetry
    intro: >-
      Every agent sends its metrics, logs, and traces to vmauth on ci01 with
      this one login, and victoriametrics-server reads the same three to
      accept it. Staged on
      [VictoriaMetrics (ci01)](../hosts/ci01-victoriametrics.md#values).
    names:
      GLOBAL_VMAUTH_USER: {kind: Variable, value: "Your choice"}
      GLOBAL_VMAUTH_PASS: {kind: Secret, value: "Your choice, alphanumeric only"}
      GLOBAL_VMAUTH_HOST: {kind: Variable, value: "`vmauth.ci01.home.myah-mitchell.com`, the hostname with no scheme"}

  - id: mail-relay
    title: Mail
    intro: >-
      Postfix on ci01 relays the fleet's service mail. The first value is its
      login at the upstream relay, staged on
      [Core infrastructure (ci01)](../hosts/ci01-core-infra.md#values). The rest
      tell a stack how to reach Postfix. authentik-server is the only stack
      that reads them today, so they are staged on
      [Identity (id01)](../hosts/id01-identity.md#values).
    notes: >-
      Postfix takes mail from the internal subnet with no login, so
      `GLOBAL_EMAIL_USER` and `GLOBAL_EMAIL_PASS` have nothing to hold, and a
      made-up value would have the stack try a login Postfix does not offer.
      A stack that reads them has its two keys set to blank in the inventory
      instead. See [Blanking a reference](#blanking).
    names:
      POSTFIX_RELAYHOST_PASSWORD: {kind: Secret, value: "The password of the account at the upstream relay"}
      GLOBAL_EMAIL_HOST: {kind: Variable, value: "ci01's address, such as `172.16.7.121`"}
      GLOBAL_EMAIL_PORT: {kind: Variable, value: "`25`"}
      GLOBAL_EMAIL_USER: {kind: Variable, value: "Not created. See the note below"}
      GLOBAL_EMAIL_PASS: {kind: Secret, value: "Not created. See the note below"}
      GLOBAL_EMAIL_TLS: {kind: Variable, value: "`false`"}
      GLOBAL_EMAIL_SSL: {kind: Variable, value: "`false`"}
      GLOBAL_EMAIL_FROM: {kind: Variable, value: "The address service mail is sent as, such as `authentik@myah-mitchell.com`"}

  - id: authentik
    title: Authentik
    intro: >-
      Read by authentik-server on id01. Staged on
      [Identity (id01)](../hosts/id01-identity.md#values).
    names:
      AUTHENTIK_SECRET_KEY: {kind: Secret, value: "96 alphanumeric characters of your choice"}
      AUTHENTIK_POSTGRES_USER: {kind: Secret, value: "Your choice"}
      AUTHENTIK_POSTGRES_PASSWORD: {kind: Secret, value: "Your choice, alphanumeric only"}
      GLOBAL_GEOIPUPDATE_ACCOUNT_ID: {kind: Secret, value: "Your MaxMind account ID"}
      GLOBAL_GEOIPUPDATE_LICENSE_KEY: {kind: Secret, value: "A MaxMind licence key"}

  - id: dockns
    title: dockns
    intro: >-
      dockns writes DNS records for the containers that carry its labels, and
      system-agent carries it to every VM. The two UniFi values are read on
      every VM, and dockns writes no internal record today, so they are staged
      for later. The three
      Cloudflare values and the public address matter only on a VM that hosts
      something the internet reaches. Staged on
      [Leaving bootstrap mode](../procedures/leave-bootstrap-mode.md#values),
      which is where system-agent first deploys.
    notes: >-
      A host with nothing public on it has the three Cloudflare keys and
      `DOCKNS_WAN_IP` set to blank in the inventory. The UniFi values belong
      to one site's console. A fleet on two sites needs a pair per site, under
      names of your own such as `DOCKNS_UNIFI_HOST_CLOUD`, with the second
      site's hosts pointed at them through `komodo_stack_env`.
    names:
      DOCKNS_UNIFI_HOST: {kind: Variable, value: "The local URL of the site's UniFi console, such as `https://172.16.7.1`, not `api.ui.com`"}
      DOCKNS_UNIFI_API_KEY: {kind: Secret, value: "A local API key from that console, with permission to manage DNS records"}
      DOCKNS_CF_API_KEY: {kind: Secret, value: "A Cloudflare API token with DNS edit rights on the zone"}
      DOCKNS_CF_ACCOUNT_ID: {kind: Secret, value: "From the account overview page in the Cloudflare dashboard"}
      DOCKNS_CF_ZONE_ID: {kind: Secret, value: "From the zone overview page for the domain"}
      DOCKNS_WAN_IP: {kind: Variable, value: "The site's public address, the one public records point at"}

  - id: mail-server
    title: Stalwart and Bulwark
    intro: >-
      Read by stalwart-server on mx01, which is optional. Staged on
      [Mail (mx01)](../hosts/mx01-mail.md#values). The two OIDC values come
      from the Authentik application that page creates.
    names:
      STALWART_LICENSE_KEY: {kind: Secret, value: "The Stalwart Enterprise licence key"}
      BULWARK_SESSION_SECRET_KEY: {kind: Secret, value: "96 alphanumeric characters of your choice"}
      MAIL_OIDC_CLIENT_ID: {kind: Secret, value: "The Authentik provider's client ID"}
      MAIL_OIDC_CLIENT_SECRET: {kind: Secret, value: "The Authentik provider's client secret"}

  - id: crowdsec
    title: CrowdSec
    intro: >-
      Read by crowdsec-agent only. CrowdSec was cut from the plan and no host
      runs the stack, so nothing stages this value. It is listed because the
      stack still references it.
    names:
      GLOBAL_CROWDSEC_LAPI_URL: {kind: Variable, value: "The CrowdSec server's API URL"}
